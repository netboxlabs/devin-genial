name: Estate checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install netboxlabs-diode-sdk==1.14.0
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest lab.test_setup -v
      - run: python -m estates generate profiles/bank.toml --out build/bank
      - run: python -m estates sdk-check build/bank/diode
      - run: python -m estates generate profiles/bank-depth.toml --out build/depth
      - run: python -m estates sdk-check build/depth/diode
      - run: python -m estates scenario build/bank/plan.json --site br-s0002 --out build/scenario
      - run: python -m estates build build/scenario/acquired/plan.json --out build/acquired
      - run: python -m estates sdk-check build/acquired/diode
      - run: python -m estates build build/scenario/refreshed/plan.json --out build/refreshed
      - run: python -m estates sdk-check build/refreshed/diode
      - name: Qualify composed profiles and their shared power scenario
        run: |
          for profile in enterprise-dc school-district hospital-clinics provider-backbone retail-chain university-campus msp manufacturing utility school-wireless hospital-wireless; do
            python -m estates generate "profiles/${profile}.toml" --out "build/${profile}"
            python -m estates sdk-check "build/${profile}/diode"
            python -m estates scenario "build/${profile}/plan.json" --kind loss-of-power-diversity --out "build/${profile}-power"
            python -m estates scenario-check "build/${profile}-power/scenario.json"
            python -m estates sdk-check "build/${profile}-power/changed/diode"
          done
      - name: Qualify the Assurance drift twin and its observed payload
        run: |
          for profile in bank school-district hospital-clinics provider-backbone retail-chain university-campus msp manufacturing utility; do
            python -m estates drift "build/${profile}/plan.json" --out "build/${profile}-drift"
            python -m estates drift-check "build/${profile}-drift"
            python -m estates sdk-check "build/${profile}-drift/observed"
          done
      - name: Qualify provider span maintenance and its exact inverse
        run: |
          python -m estates generate profiles/provider-maintenance.toml --out build/provider-maintenance
          python -m estates scenario-check build/provider-maintenance/scenario.json
          python -m estates sdk-check build/provider-maintenance/baseline/diode
          python -m estates sdk-check build/provider-maintenance/changed/diode
      - name: Qualify the alternate vendor lines across all profiles
        run: |
          for profile in bank enterprise-dc school-district hospital-clinics provider-backbone retail-chain university-campus msp manufacturing utility; do
            cp "profiles/${profile}.toml" "build/${profile}-juniper.toml"
            printf '\n[hardware]\naccess = "juniper"\nleaf = "juniper"\nap = "aruba"\n' >> "build/${profile}-juniper.toml"
            python -m estates generate "build/${profile}-juniper.toml" --out "build/${profile}-juniper"
            python -m estates sdk-check "build/${profile}-juniper/diode"
          done
      - name: Qualify optional dual-stack across all profiles
        run: |
          for profile in bank enterprise-dc school-district hospital-clinics provider-backbone retail-chain university-campus msp manufacturing utility; do
            python -c 'import sys; from pathlib import Path; Path(sys.argv[2]).write_text("ipv6_pool = \"2001:db8::/32\"\n" + Path(sys.argv[1]).read_text())' "profiles/${profile}.toml" "build/${profile}-ipv6.toml"
            python -m estates generate "build/${profile}-ipv6.toml" --out "build/${profile}-ipv6"
            python -m estates sdk-check "build/${profile}-ipv6/diode"
          done
      - run: git diff --check
