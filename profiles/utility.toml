# An electric utility's operations estate: two control centers and the
# substations they document.
#
# Each substation is one site: a control house with a control room and a
# switchyard of permanently positioned bays. The station (OT) endpoints — one
# remote terminal unit and one protection relay per bay, two station HMIs and a
# station gateway — sit on their own `protection`, `telemetry` and `station`
# segments, behind their own access pair and their own distribution pair; the
# only modeled forwarding path to the corporate tier is the `conduit` segment
# trunked between the two distribution pairs; the dedicated management ports
# and the shared serial console server are the two other declared crossings.
#
# That separation is inventory and intended boundaries. It is NOT enforced
# security, NOT an air gap, NOT an electronic security perimeter and NOT a NERC
# CIP claim; no SCADA or EMS function is executed and no utility protocol is
# configured anywhere. Bays are installed equipment positions, not electrical
# ratings. See profiles/utility.md for the complete limits and everything this
# dataset does not assert.
profile = "utility"
namespace = "northgate"
name = "Northgate Power and Light"
address_pool = "10.0.0.0/8"
seed = 42
as_of = "2026-09-01"
reserve_fraction = 0.2

# 1 (primary only) or 2 (primary and backup). Both carry the same shared
# operational services; a second center is inventory, never a demonstrated
# failover.
control_centers = 2

# Substations. `kind` is "transmission" or "distribution" and selects the
# authored corporate presence and planning demand — never a voltage class or
# electrical rating. `bays` is installed switchyard equipment positions. Bays
# may grow; they may not shrink, and `kind` may not change, without a new
# baseline.
[[substations]]
key = "oakridge"
kind = "transmission"
bays = 10

[[substations]]
key = "milldam"
kind = "transmission"
bays = 8

[[substations]]
key = "fairhaven"
kind = "distribution"
bays = 6

# A small distribution substation. Both keys could be omitted here: the
# authored defaults are `kind = "distribution"` and `bays = 6`.
[[substations]]
key = "stonebrook"
kind = "distribution"
bays = 4
