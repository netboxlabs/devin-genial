# NetBox Labs community showcase: one Great Lakes regional carrier seeded ALONE
# onto a dedicated tenant's main (a second estate cannot pass the fresh-load
# occupancy gate). 12 PoPs, three per metro, and 108 customers on 275 premises
# (v0.17 regional-carrier footprint): 36 private-L3 VPN customers (2-12 sites,
# each hub dual-homed on two NIDs; one still onboarding, one closing a branch),
# 40 unmanaged and 20 managed dedicated-internet customers (four large DIA on
# the 10G NID tier), and 12 two-ended Ethernet private lines. Every premises is
# the carrier's demarcation (NID, plus a CE in an MPOE wall cabinet where the
# carrier manages one) handing off to customer-owned gear (lan_endpoints = 0:
# a carrier does not inventory its customers' desktops). Suburban PoPs with
# few street-grid anchors serve fewer premises. Dual-stack (DIA stays
# IPv4-only); Juniper access beside the MX204 PEs, Arista
# leaf/spine kept. Customer names are authored; fictional design inputs.
# Runbook: .claude/skills/showcase-tenant/SKILL.md.
profile = "provider-backbone"
namespace = "inland-fiber"
name = "Inland Lakes Fiber"
seed = 20261001
as_of = "2026-09-28"
address_pool = "10.0.0.0/8"
ipv6_pool = "2001:db8::/32"
reserve_fraction = 0.2
patching = "direct"
demo = "baseline"
topology = "incremental-mesh"
noc_pop_a = "chicago-cermak"
noc_pop_b = "detroit-new-center"
noc_peak_mbps = 200
discovery_lab = true
# Solo-tenant mode: main-scoped names (owner, export templates, webhook, event
# rule, custom link, choice set) drop the "inland-fiber " prefix on this
# dedicated tenant; slugs and identities keep the namespace.
tenancy = "dedicated"

